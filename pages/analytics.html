<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - ShopAdmin</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><i class="fas fa-store"></i><h2>ShopAdmin</h2></div>
            <nav class="sidebar-nav">
                <a href="../index.html" class="nav-item"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                <a href="products.html" class="nav-item"><i class="fas fa-box"></i> Products</a>
                <a href="orders.html" class="nav-item"><i class="fas fa-shopping-cart"></i> Orders</a>
                <a href="customers.html" class="nav-item"><i class="fas fa-users"></i> Customers</a>
                <a href="analytics.html" class="nav-item active"><i class="fas fa-chart-line"></i> Analytics</a>
                <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Settings</a>
            </nav>
            <div class="sidebar-footer"><div class="user-info"><img src="https://ui-avatars.com/api/?name=Admin+User&background=4f46e5&color=fff" alt="Admin"><div><strong>Admin User</strong><span>admin@shop.com</span></div></div></div>
        </aside>
        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <div class="search-bar"><i class="fas fa-search"></i><input type="text" placeholder="Search..." id="globalSearch"></div>
                <div class="topbar-actions"><button class="icon-btn" id="notifBtn"><i class="fas fa-bell"></i><span class="badge">3</span></button></div>
            </header>
            <div class="content">
                <div class="page-header"><h1>Analytics</h1><p>Detailed insights into your store performance</p></div>
                <div class="charts-row">
                    <div class="chart-card"><h3>Monthly Revenue</h3><canvas id="revChart" height="120"></canvas></div>
                    <div class="chart-card"><h3>Orders by Status</h3><canvas id="statusChart" height="120"></canvas></div>
                </div>
                <div class="charts-row">
                    <div class="chart-card"><h3>Top Products</h3><canvas id="topChart" height="100"></canvas></div>
                    <div class="chart-card"><h3>Customer Growth</h3><canvas id="growthChart" height="100"></canvas></div>
                </div>
            </div>
        </main>
    </div>
    <div class="notif-panel" id="notifPanel"><div class="notif-header"><h3>Notifications</h3><button id="closeNotif"><i class="fas fa-times"></i></button></div><div class="notif-list"></div></div>
    <script src="../js/app.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        new Chart(document.getElementById('revChart'), {
            type: 'bar',
            data: { labels: ['Jun','Jul','Aug','Sep','Oct','Nov'], datasets: [{ label: 'Revenue', data: [18000,21000,19500,23000,25000,24580], backgroundColor: '#4f46e5' }] },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
        new Chart(document.getElementById('statusChart'), {
            type: 'pie',
            data: { labels: ['Completed','Processing','Pending','Cancelled'], datasets: [{ data: [45,20,25,10], backgroundColor: ['#10b981','#3b82f6','#f59e0b','#ef4444'] }] },
            options: { responsive: true }
        });
        new Chart(document.getElementById('topChart'), {
            type: 'bar',
            data: { labels: ['Headphones','Watch','Shoes','Speaker','Wallet'], datasets: [{ label: 'Units Sold', data: [120,95,80,65,50], backgroundColor: '#8b5cf6' }] },
            options: { indexAxis: 'y', responsive: true, plugins: { legend: { display: false } } }
        });
        new Chart(document.getElementById('growthChart'), {
            type: 'line',
            data: { labels: ['Jun','Jul','Aug','Sep','Oct','Nov'], datasets: [{ label: 'New Customers', data: [45,62,58,80,95,110], borderColor: '#10b981', fill: false, tension: 0.3 }] },
            options: { responsive: true }
        });
    });
    </script>
</body>
</html>
